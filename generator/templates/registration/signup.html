<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — Mosaico Pixel</title>
<style>
  :root{--ink:#16202e;--soft:#54627a;--line:#d8dee8;--bg:#eef1f5;--panel:#fff;--accent:#1f5fcc;--accent-d:#17439a}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  .card{width:min(460px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;box-shadow:0 8px 28px rgba(22,32,46,.07)}
  h1{margin:0 0 6px;font-size:24px}.sub{margin:0 0 22px;color:var(--soft);font-size:14px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin-bottom:6px}
  input{width:100%;font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:14px}
  .helptext{display:block;color:var(--soft);font-size:12px;margin:-8px 0 12px}ul.errorlist{margin:0 0 12px;padding:10px 12px 10px 28px;background:#fff1f1;border:1px solid #ffcaca;color:#9f1d1d;border-radius:8px;font-size:13px}
  .btn{width:100%;font:inherit;font-weight:700;border:1px solid var(--accent);border-radius:10px;padding:11px 14px;background:var(--accent);color:#fff;cursor:pointer}.btn:hover{background:var(--accent-d)}
  .links{margin-top:16px;font-size:13px}.links a{color:var(--accent);text-decoration:none}.links a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <h1>Crear cuenta</h1>
    <p class="sub">Registro manual con usuario y contraseña.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Crear cuenta</button>
    </form>
    <div class="links"><a href="{% url 'login' %}">Ya tengo cuenta</a></div>
  </main>
</body>
</html>
